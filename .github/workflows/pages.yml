name: Build and Deploy AsciiDoc to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build AsciiDoc HTML files
  build:
    runs-on: ubuntu-latest
    name: convert asciidoc to html
    steps:
    # Checkout the repository
    # See: https://github.com/actions/checkout
    - name: Checkout
      uses: actions/checkout@v6

    # Convert AsciiDoc files to HTML using the official image pinned to release 1.107.0
    # Release: https://github.com/asciidoctor/docker-asciidoctor/releases
    # Tag: https://hub.docker.com/r/asciidoctor/docker-asciidoctor/tags
    - name: Build HTML with Asciidoctor
      run: |
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --volume "$GITHUB_WORKSPACE:/documents" \
          --workdir /documents \
          asciidoctor/docker-asciidoctor@sha256:23c022800c00bd7b73fe4e3deca49c77500f0fb34035b131cfed3f835e8d9de9 \
          make -C docs adoc

    # Upload the generated site as an artifact for deployment
    # See: https://github.com/actions/upload-pages-artifact
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: dist/

  # Deploy to GitHub Pages
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
